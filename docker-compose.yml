version: '3.8'

services:
  webapp:
    build: 
      context: ./WebApp
      dockerfile: Dockerfile
    container_name: python_webapp
    ports:
      - "8098:5000"
    restart: unless-stopped

  nginx-server:
    image: nginx:alpine
    container_name: ready_nginx
    ports:
      - "80:80"
    restart: unless-stopped

  client:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    container_name: python_client
    depends_on:
      - webapp
    restart: unless-stopped
